{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Instagram{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{% static 'web/style.css' %}">
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.4/dist/htmx.min.js" defer></script>
</head>
<body>
    {% if user.is_authenticated %}
    <aside class="sidebar" data-testid="sidebar">
        <nav class="sidebar-nav">
            <a class="sidebar-logo" href="{% url 'web:feed' %}" data-testid="sidebar-logo">
                <i class="bi bi-instagram" aria-hidden="true"></i>
                <span class="sidebar-label">Instagram</span>
            </a>
            <a class="sidebar-link{% if request.path == '/web/feed/' %} active{% endif %}"
               href="{% url 'web:feed' %}" data-testid="nav-home">
                <i class="bi bi-house" aria-hidden="true"></i>
                <span class="sidebar-label">Home</span>
            </a>
            <a class="sidebar-link sidebar-link--placeholder" aria-disabled="true" tabindex="-1"
               data-testid="nav-search">
                <i class="bi bi-search" aria-hidden="true"></i>
                <span class="sidebar-label">Search</span>
            </a>
            <a class="sidebar-link sidebar-link--placeholder" aria-disabled="true" tabindex="-1"
               data-testid="nav-explore">
                <i class="bi bi-compass" aria-hidden="true"></i>
                <span class="sidebar-label">Explore</span>
            </a>
            <a class="sidebar-link sidebar-link--placeholder" aria-disabled="true" tabindex="-1"
               data-testid="nav-messages">
                <i class="bi bi-envelope" aria-hidden="true"></i>
                <span class="sidebar-label">Messages</span>
            </a>
            <a class="sidebar-link sidebar-link--placeholder" aria-disabled="true" tabindex="-1"
               data-testid="nav-notifications">
                <i class="bi bi-bell" aria-hidden="true"></i>
                <span class="sidebar-label">Notifications</span>
            </a>
            <form class="sidebar-link sidebar-create" method="post" action="{% url 'web:create_post' %}"
                  data-testid="nav-create">
                {% csrf_token %}
                <button type="submit">
                    <i class="bi bi-plus-square" aria-hidden="true"></i>
                    <span class="sidebar-label">Create</span>
                </button>
            </form>
            <a class="sidebar-link{% if '/web/profile/' in request.path %} active{% endif %}"
               href="{% url 'web:profile' user.pk %}"
               data-testid="nav-profile">
                <i class="bi bi-person" aria-hidden="true"></i>
                <span class="sidebar-label">Profile</span>
            </a>
        </nav>
        <form class="sidebar-logout" method="post" action="{% url 'web:logout' %}" data-testid="logout-form">
            {% csrf_token %}
            <button type="submit">
                <i class="bi bi-box-arrow-right" aria-hidden="true"></i>
                <span class="sidebar-label">Logout</span>
            </button>
        </form>
    </aside>
    {% endif %}
    <main class="app-main">
        {% include "web/partials/messages.html" %}
        {% block content %}{% endblock %}
    </main>
    <div id="modal-container"></div>
    <script>
        document.body.addEventListener("toast", function (event) {
            var container = document.getElementById("messages");
            if (!container) { return; }
            var toast = document.createElement("div");
            toast.className = "toast toast-success";
            var detail = event.detail || {};
            toast.textContent = detail.value || detail.message || detail;
            container.appendChild(toast);
        });
    </script>
</body>
</html>
